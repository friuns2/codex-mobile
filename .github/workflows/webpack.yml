name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]   # Removed deprecated Node 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'                  # Enable caching for faster npm installs

      - name: Install dependencies (including webpack-cli)
        run: |
          npm ci                         # Use clean install for reproducibility
          npm install --save-dev webpack-cli   # Add CLI if not in package.json

      - name: Build with Webpack
        run: npx webpack
